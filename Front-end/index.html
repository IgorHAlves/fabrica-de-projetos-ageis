<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="./src/assets/shirt-solid-full.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.Tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Moda Minimalista</title>
  <meta name="description"
    content="Descubra peças atemporais com design limpo e qualidade excepcional. Loja online de moda minimalista com as melhores marcas.">

</head>


<body>
  <div id="app">
    <!-- Loading inicial antes do Vue montar -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f3f4f6;">
      <div style="text-align: center;">
        <div style="display: inline-block; width: 4rem; height: 4rem; border-radius: 9999px; border-bottom-width: 4px; border-color: #2563eb; margin-bottom: 1rem; animation: spin 1s linear infinite;"></div>
        <p style="color: #4b5563; font-size: 1.125rem; font-weight: 600; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">Carregando...</p>
      </div>
    </div>
    <style>
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>


</html>
